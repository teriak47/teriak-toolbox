[package]
name = "graphax"
version = "0.3.0"
description = "Graphax desktop application"
authors = ["Teriak47"]
edition = "2021"
publish = false

[lib]
name = "graphax_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
