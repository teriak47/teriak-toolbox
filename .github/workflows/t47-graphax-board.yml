name: Graphax

on:
  pull_request:
    paths:
      - 'data/visualization/t47-graphax-board/**'
      - '.github/workflows/t47-graphax-board.yml'
  push:
    branches: [main]
    paths:
      - 'data/visualization/t47-graphax-board/**'
      - '.github/workflows/t47-graphax-board.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Graphax build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data/visualization/t47-graphax-board
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: npm install --global pnpm@12.6.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
