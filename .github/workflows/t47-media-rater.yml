name: Media rater

on:
  pull_request:
    paths:
      - 'media/rating/t47-media-rater/**'
      - '.github/workflows/t47-media-rater.yml'
  push:
    branches: [main]
    paths:
      - 'media/rating/t47-media-rater/**'
      - '.github/workflows/t47-media-rater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Media rater tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: media/rating/t47-media-rater
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: media/rating/t47-media-rater/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
